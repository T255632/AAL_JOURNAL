function metrics(trades=data?.trades||[]){const closed=trades.filter(t=>t.status==='closed'&&Number.isFinite(Number(t.realizedPnl))).sort((a,b)=>new Date(a.exitTime||a.tradeDate)-new Date(b.exitTime||b.tradeDate));const pnl=closed.map(t=>num(t.realizedPnl));const wins=closed.filter(t=>num(t.realizedPnl)>.01);const losses=closed.filter(t=>num(t.realizedPnl)<-.01);const bes=closed.filter(t=>Math.abs(num(t.realizedPnl))<=.01);const gp=wins.reduce((s,t)=>s+num(t.realizedPnl),0);const gl=Math.abs(losses.reduce((s,t)=>s+num(t.realizedPnl),0));const decided=wins.length+losses.length;const wr=decided?wins.length/decided*100:0;const lr=decided?losses.length/decided*100:0;const avgWin=wins.length?gp/wins.length:0;const avgLoss=losses.length?gl/losses.length:0;const pf=gl?gp/gl:(gp?Infinity:0);const expectancy=(wr/100*avgWin)-(lr/100*avgLoss);let equity=0,peak=0,maxDD=0;const curve=closed.map(t=>{equity+=num(t.realizedPnl);peak=Math.max(peak,equity);maxDD=Math.max(maxDD,peak-equity);return{date:t.exitTime||t.tradeDate,value:equity,drawdown:peak-equity}});let currentWin=0,currentLoss=0,longestWin=0,longestLoss=0,w=0,l=0;closed.forEach(t=>{const p=num(t.realizedPnl);if(p>.01){w++;l=0;longestWin=Math.max(longestWin,w)}else if(p<-.01){l++;w=0;longestLoss=Math.max(longestLoss,l)}else{w=0;l=0}});for(let i=closed.length-1;i>=0;i--){const p=num(closed[i].realizedPnl);if(p>.01&&!currentLoss)currentWin++;else if(p<-.01&&!currentWin)currentLoss++;else break}const compliant=closed.filter(allChecklist);const noncompliant=closed.filter(t=>!allChecklist(t));const avg=(arr,key)=>arr.length?arr.reduce((s,t)=>s+num(t[key]),0)/arr.length:0;return{closed,total:closed.length,net:pnl.reduce((a,b)=>a+b,0),grossProfit:gp,grossLoss:gl,wins:wins.length,losses:losses.length,breakeven:bes.length,winRate:wr,lossRate:lr,avgWin,avgLoss,profitFactor:pf,expectancy,avgPlannedR:avg(closed,'plannedRR'),avgRealizedR:avg(closed,'realizedR'),maxDrawdown:maxDD,currentWin,currentLoss,longestWin,longestLoss,complianceRate:closed.length?compliant.length/closed.length*100:0,compliantExpectancy:compliant.length?compliant.reduce((s,t)=>s+num(t.realizedPnl),0)/compliant.length:0,noncompliantExpectancy:noncompliant.length?noncompliant.reduce((s,t)=>s+num(t.realizedPnl),0)/noncompliant.length:0,checklistEdge:(compliant.length?compliant.reduce((s,t)=>s+num(t.realizedPnl),0)/compliant.length:0)-(noncompliant.length?noncompliant.reduce((s,t)=>s+num(t.realizedPnl),0)/noncompliant.length:0),curve}}
function groupPerformance(trades,key){const map={};trades.filter(t=>t.status==='closed').forEach(t=>{let k;if(key==='weekday')k=new Date(t.exitTime||(t.tradeDate+'T12:00:00')).toLocaleDateString(undefined,{weekday:'short'});else if(key==='compliance')k=allChecklist(t)?'Compliant':'Noncompliant';else k=t[key]||'Unspecified';(map[k]??=[]).push(t)});return Object.entries(map).map(([name,arr])=>{const m=metrics(arr);return{name,trades:m.total,net:m.net,winRate:m.winRate,expectancy:m.expectancy,pf:m.profitFactor}}).sort((a,b)=>b.net-a.net)}
function filteredTrades(){return data.trades.filter(t=>{const h=ui.history;const q=h.q.trim().toLowerCase();if(q&&!`${t.symbol} ${t.setup} ${t.tags} ${t.entryReason}`.toLowerCase().includes(q))return false;if(h.account!=='all'&&t.accountId!==h.account)return false;if(h.result!=='all'&&resultOf(t)!==h.result)return false;if(h.compliance!=='all'&&String(allChecklist(t))!==h.compliance)return false;return true}).sort((a,b)=>{if(ui.history.sort==='date-asc')return new Date(a.tradeDate)-new Date(b.tradeDate);if(ui.history.sort==='pnl-desc')return num(b.realizedPnl)-num(a.realizedPnl);if(ui.history.sort==='pnl-asc')return num(a.realizedPnl)-num(b.realizedPnl);return new Date(b.tradeDate)-new Date(a.tradeDate)})}

function equitySvg(curve,height=230){if(!curve.length)return'<div class="empty">No closed-trade data yet.</div>';const w=900,h=height,p=28;const vals=[0,...curve.map(x=>x.value)];const min=Math.min(...vals),max=Math.max(...vals);const range=max-min||1;const pts=curve.map((x,i)=>{const xx=p+(i/(Math.max(1,curve.length-1)))*(w-p*2);const yy=h-p-((x.value-min)/range)*(h-p*2);return`${xx.toFixed(1)},${yy.toFixed(1)}`}).join(' ');const zeroY=h-p-((0-min)/range)*(h-p*2);return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".35"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>${[.25,.5,.75].map(r=>`<line class="chart-grid" x1="${p}" y1="${p+(h-2*p)*r}" x2="${w-p}" y2="${p+(h-2*p)*r}"/>`).join('')}<line x1="${p}" y1="${zeroY}" x2="${w-p}" y2="${zeroY}" stroke="var(--border2)" stroke-dasharray="5 5"/><polygon class="chart-area" points="${p},${h-p} ${pts} ${w-p},${h-p}"/><polyline class="chart-line" points="${pts}"/><text class="chart-label" x="${p}" y="15">${money(max,data.profile.baseCurrency)}</text><text class="chart-label" x="${p}" y="${h-5}">${money(min,data.profile.baseCurrency)}</text></svg>`}

function updateChecklistUI(){const form=$('#trade-form');if(!form)return;const names=['marketStructure','premiumDiscount','liquidity','supplyDemand','liquidityBeforeBos'];const values=names.map(n=>form.elements[n].checked);names.forEach((n,i)=>$(`[data-check-card="${n}"]`)?.classList.toggle('checked',values[i]));const count=values.filter(Boolean).length;const complete=count===5;const v=$('#setup-verdict');v.className='verdict '+(complete?'good':'bad');v.querySelector('b').textContent=complete?'Valid setup — all five rules confirmed.':'No setup — wait.';$('#setup-score').textContent=count+'/5';$('#setup-score').className='badge '+(complete?'badge-valid':'badge-warn');const missing=names.filter((_,i)=>!values[i]).map((n)=>({marketStructure:'Market Structure',premiumDiscount:'Premium / Discount',liquidity:'Liquidity',supplyDemand:'Supply / Demand',liquidityBeforeBos:'Liquidity before BOS'}[n]));$('#setup-missing').textContent=complete?'The AAL Journal checklist is complete.':'Missing: '+missing.join(', ')+'.'}
function updateTradeCalculations(){const f=$('#trade-form');if(!f)return;const entry=strictNum(f.elements.entryPrice.value),sl=strictNum(f.elements.stopLoss.value),tp=strictNum(f.elements.takeProfit.value),exit=strictNum(f.elements.exitPrice.value),size=strictNum(f.elements.positionSize.value),pv=Number.isFinite(strictNum(f.elements.pointValue.value))?strictNum(f.elements.pointValue.value):1,fees=num(f.elements.commission.value)+num(f.elements.otherFees.value);const bal=num(f.elements.balanceBefore.value);if([entry,sl,size,pv].every(Number.isFinite)){const risk=Math.abs(entry-sl)*size*pv;$('#riskAmount').value=round(risk,2);if(bal)$('#riskPct').value=round(risk/bal*100,2);if(Number.isFinite(tp)){const reward=Math.abs(tp-entry)*size*pv;$('#plannedReward').value=round(reward,2);$('#plannedRR').value=risk?round(reward/risk,2):0}if(Number.isFinite(exit)){const dir=f.elements.direction.value==='long'?1:-1;const pnl=(exit-entry)*dir*size*pv-fees;$('#realizedPnl').value=round(pnl,2);$('#realizedR').value=risk?round(pnl/risk,2):0}}}
async function handleAttachment(key,file){if(!file)return;if(!file.type.startsWith('image/'))return toast('Only image files are supported.','error');if(file.size>12*1024*1024)return toast('Image is too large. Maximum 12 MB before compression.','error');try{ui.pendingAttachments[key]=await compressImage(file,1280,.76);const slot=$('#slot-'+key);if(slot)slot.outerHTML=attachmentSlot(key,key[0].toUpperCase()+key.slice(1)+' trade');toast('Screenshot added.')}catch{toast('Could not process that image.','error')}}
function compressImage(file,max=1280,quality=.76){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};img.src=reader.result};reader.readAsDataURL(file)})}

textBlock('Thesis',t.thesis)}${textBlock('Entry reason',t.entryReason)}${textBlock('Exit reason',t.exitReason)}${textBlock('What went well',t.wentWell)}</div><div class="card card-pad"><h3>Review</h3>${textBlock('What went wrong',t.wentWrong)}${textBlock('Lesson',t.lesson)}${textBlock('Checklist evidence',t.checklistNotes?.evidence)}${textBlock('Psychology',`${t.emotionBefore||'—'} → ${t.emotionAfter||'—'}`)}</div></div>${attachmentViewer(t.attachments)}</div><div class="modal-foot"><button class="btn btn-danger" onclick="deleteTrade('${t.id}')">Delete</button><button class="btn btn-ghost" onclick="duplicateTrade('${t.id}');closeModal()">Duplicate</button><button class="btn btn-primary" onclick="closeModal();editTrade('${t.id}')">Edit</button></div></div>`)}

function renderHistory(){const list=filteredTrades();const m=metrics(list);return `${pageHead('Trade History','Search, filter, inspect, edit, duplicate, or delete journal records.',`<button class="btn btn-ghost" onclick="exportCSV(filteredTrades())">Export filtered CSV</button><button class="btn btn-primary" onclick="newTrade()">＋ New trade</button>`)}<div class="grid grid-4" style="margin-bottom:16px"><div class="card metric-card"><div class="metric-label">Filtered trades</div><div class="metric-value">${list.length}</div></div><div class="card metric-card"><div class="metric-label">Net P/L</div><div class="metric-value ${m.net>=0?'positive':'negative'}">${signedMoney(m.net,data.profile.baseCurrency)}</div></div><div class="card metric-card"><div class="metric-label">Win rate</div><div class="metric-value">${pct(m.winRate)}</div></div><div class="card metric-card"><div class="metric-label">Compliance</div><div class="metric-value">${pct(m.complianceRate)}</div></div></div><section class="card"><div class="card-pad"><div class="toolbar"><input class="input" value="${attr(ui.history.q)}" placeholder="Search symbol, setup, tag…" oninput="ui.history.q=this.value;renderHistoryBody()"><select class="select" onchange="ui.history.account=this.value;renderHistoryBody()"><option value="all">All accounts</option>${data.accounts.map(a=>`<option value="${a.id}" ${selected(ui.history.account,a.id)}>${esc(a.name)}</option>`).join('')}</select><select class="select" onchange="ui.history.result=this.value;renderHistoryBody()"><option value="all">All results</option>${['win','loss','breakeven'].map(x=>`<option ${selected(ui.history.result,x)}>${x}</option>`).join('')}</select><select class="select" onchange="ui.history.compliance=this.value;renderHistoryBody()"><option value="all">All checklist states</option><option value="true" ${selected(ui.history.compliance,'true')}>5/5 compliant</option><option value="false" ${selected(ui.history.compliance,'false')}>Noncompliant</option></select><select class="select" onchange="ui.history.sort=this.value;renderHistoryBody()"><option value="date-desc" ${selected(ui.history.sort,'date-desc')}>Newest first</option><option value="date-asc" ${selected(ui.history.sort,'date-asc')}>Oldest first</option><option value="pnl-desc" ${selected(ui.history.sort,'pnl-desc')}>Highest P/L</option><option value="pnl-asc" ${selected(ui.history.sort,'pnl-asc')}>Lowest P/L</option></select></div></div><div id="history-body">${historyBody()}</div></section>`}

function renderCalendar(){const d=ui.calendarDate;const y=d.getFullYear(),m=d.getMonth();const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());const cells=[];for(let i=0;i<42;i++){const day=new Date(start);day.setDate(start.getDate()+i);cells.push(day)}return `${pageHead('Calendar','Daily P/L, trade counts, and journal notes.',`<button class="btn btn-ghost" onclick="calendarMove(-1)">←</button><button class="btn btn-ghost" onclick="calendarToday()">Today</button><button class="btn btn-ghost" onclick="calendarMove(1)">→</button><button class="btn btn-primary" onclick="newTrade()">＋ Trade</button>`)}<div class="card"><div class="card-head"><h2>${d.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><span class="small muted">Click a day for details</span></div><div class="card-pad calendar-wrap"><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells.map(day=>calendarCell(day,m)).join('')}</div></div></div>`}
function calendarCell(day,month){const key=isoDate(day);const ts=data.trades.filter(t=>t.tradeDate===key&&t.status==='closed');const pnl=ts.reduce((s,t)=>s+num(t.realizedPnl),0);const out=day.getMonth()!==month;const today=key===isoDate();return `<div class="cal-day ${out?'out':''} ${today?'today':''}" onclick="openCalendarDay('${key}')"><div class="cal-num">${day.getDate()}</div>${data.dailyNotes[key]?'<span class="cal-note">●</span>':''}${ts.length?`<div class="cal-pnl ${pnl>=0?'positive':'negative'}">${signedMoney(pnl,data.profile.baseCurrency)}</div><div class="cal-count">${ts.length} trade${ts.length===1?'':'s'}</div>`:''}</div>`}
function calendarMove(n){ui.calendarDate=new Date(ui.calendarDate.getFullYear(),ui.calendarDate.getMonth()+n,1);render()}
function calendarToday(){ui.calendarDate=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()}

function renderAnalytics(){const m=metrics();const group=groupPerformance(data.trades,ui.analyticsGroup);const cur=data.profile.baseCurrency;const max=Math.max(1,...group.map(x=>Math.abs(x.net)));return `${pageHead('Analytics','All calculations use the same closed-trade dataset and break-even rules.',`<button class="btn btn-ghost" onclick="go('reports')">Open reports</button>`)}<div class="grid grid-4"><div class="card metric-card"><div class="metric-label">Gross profit</div><div class="metric-value positive">${money(m.grossProfit,cur)}</div></div><div class="card metric-card"><div class="metric-label">Gross loss</div><div class="metric-value negative">${money(m.grossLoss,cur)}</div></div><div class="card metric-card"><div class="metric-label">Expectancy</div><div class="metric-value ${m.expectancy>=0?'positive':'negative'}">${money(m.expectancy,cur)}</div></div><div class="card metric-card"><div class="metric-label">Max drawdown</div><div class="metric-value negative">${money(m.maxDrawdown,cur)}</div></div></div><div class="grid grid-3" style="margin-top:16px"><section class="card"><div class="card-head"><h2>Trade statistics</h2></div><div class="card-pad">${detailRows([['Closed trades',m.total],['Wins',m.wins],['Losses',m.losses],['Break-even',m.breakeven],['Average win',money(m.avgWin,cur)],['Average loss',money(m.avgLoss,cur)],['Average planned R',m.avgPlannedR.toFixed(2)+'R'],['Average realized R',m.avgRealizedR.toFixed(2)+'R']])}</div></section><section class="card"><div class="card-head"><h2>Streaks</h2></div><div class="card-pad">${detailRows([['Current wins',m.currentWin],['Current losses',m.currentLoss],['Longest win streak',m.longestWin],['Longest loss streak',m.longestLoss],['Profit factor',m.profitFactor===Infinity?'∞':m.profitFactor.toFixed(2)],['Win rate',pct(m.winRate)],['Loss rate',pct(m.lossRate)]])}</div></section><section class="card"><div class="card-head"><h2>Checklist edge</h2></div><div class="card-pad">${detailRows([['Rule-following rate',pct(m.complianceRate)],['Compliant expectancy',money(m.compliantExpectancy,cur)],['Noncompliant expectancy',money(m.noncompliantExpectancy,cur)],['Checklist edge',signedMoney(m.checklistEdge,cur)]])}<div class="alert ${m.checklistEdge>=0?'alert-success':'alert-warn'}" style="margin-top:12px">${m.checklistEdge>=0?'Your compliant trades currently outperform noncompliant trades.':'Your current sample does not yet show a positive checklist edge. Review sample size and data quality.'}</div></div></section></div><section class="card" style="margin-top:16px"><div class="card-head"><h2>Performance breakdown</h2><select class="select" style="width:auto" onchange="ui.analyticsGroup=this.value;render()">${[['symbol','Symbol'],['setup','Setup'],['session','Session'],['weekday','Weekday'],['compliance','Compliance']].map(([v,l])=>`<option value="${v}" ${selected(ui.analyticsGroup,v)}>${l}</option>`).join('')}</select></div><div class="card-pad"><div class="bar-list">${group.length?group.map(x=>`<div class="bar-row"><div class="truncate"><b>${esc(x.name)}</b><div class="tiny faint">${x.trades} trades · ${pct(x.winRate)}</div></div><div class="bar-track"><div class="bar-fill ${x.net>=0?'pos':'neg'}" style="width:${Math.max(3,Math.abs(x.net)/max*100)}%"></div></div><div class="right mono ${x.net>=0?'positive':'negative'}">${signedMoney(x.net,cur)}</div></div>`).join(''):'<div class="empty">No data to group yet.</div>'}</div></div></section>`}
function renderCharts(){const m=metrics();const monthly=groupByMonth(data.trades);const max=Math.max(1,...monthly.map(x=>Math.abs(x.net)));return `${pageHead('Charts','Journal-derived charts only. AAL Journal does not claim live market data.',`<button class="btn btn-primary" onclick="newTrade()">＋ Add data</button>`)}<div class="grid grid-2"><section class="card"><div class="card-head"><h2>Cumulative equity</h2><span class="small muted">Net closed P/L</span></div><div class="card-pad chart">${equitySvg(m.curve,270)}</div></section><section class="card"><div class="card-head"><h2>Drawdown</h2><span class="small muted">Peak-to-trough</span></div><div class="card-pad chart">${drawdownSvg(m.curve)}</div></section></div><section class="card" style="margin-top:16px"><div class="card-head"><h2>Monthly P/L</h2></div><div class="card-pad"><div class="bar-list">${monthly.length?monthly.map(x=>`<div class="bar-row"><b>${esc(x.month)}</b><div class="bar-track"><div class="bar-fill ${x.net>=0?'pos':'neg'}" style="width:${Math.max(3,Math.abs(x.net)/max*100)}%"></div></div><div class="right mono ${x.net>=0?'positive':'negative'}">${signedMoney(x.net,data.profile.baseCurrency)}</div></div>`).join(''):'<div class="empty">No closed trades yet.</div>'}</div></div></section>`}
function drawdownSvg(curve){if(!curve.length)return'<div class="empty">No drawdown data.</div>';const w=900,h=270,p=28,max=Math.max(1,...curve.map(x=>x.drawdown));const pts=curve.map((x,i)=>`${p+(i/Math.max(1,curve.length-1))*(w-2*p)},${p+(x.drawdown/max)*(h-2*p)}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${[.25,.5,.75].map(r=>`<line class="chart-grid" x1="${p}" y1="${p+(h-2*p)*r}" x2="${w-p}" y2="${p+(h-2*p)*r}"/>`).join('')}<polyline points="${pts}" fill="none" stroke="var(--short)" stroke-width="2.5"/><text class="chart-label" x="${p}" y="15">Max ${money(max,data.profile.baseCurrency)}</text></svg>`}
function groupByMonth(trades){const map={};trades.filter(t=>t.status==='closed').forEach(t=>{const k=(t.tradeDate||'').slice(0,7)||'Unknown';map[k]=(map[k]||0)+num(t.realizedPnl)});return Object.entries(map).sort().map(([k,v])=>({month:k==='Unknown'?k:new Date(k+'-01T12:00').toLocaleDateString(undefined,{month:'short',year:'numeric'}),net:v}))}
function renderPlaybook(){return `${pageHead('Playbook','Define repeatable setups and compare their journal performance.',`<button class="btn btn-primary" onclick="editPlaybook()">＋ New setup</button>`)}${data.playbooks.length?`<div class="setup-cards">${data.playbooks.map(p=>{const ts=data.trades.filter(t=>String(t.setup).toLowerCase()===String(p.name).toLowerCase());const m=metrics(ts);const score=ts.length?Math.round(m.complianceRate):0;return `<article class="setup-card"><div class="split"><div><span class="badge badge-neutral">${esc(p.market||'All markets')}</span><h3 style="margin-top:10px">${esc(p.name)}</h3><div class="small muted">${esc(p.direction||'Both')} · Minimum ${num(p.minRR,2).toFixed(1)}R</div></div><div class="score-ring" style="--score:${score}%"><span>${score}%</span></div></div><p class="small muted" style="line-height:1.6;min-height:44px">${esc(p.description||'No description yet.')}</p><div class="kpi-row"><span class="muted">Trades</span><b>${m.total}</b></div><div class="kpi-row"><span class="muted">Net P/L</span><b class="${m.net>=0?'positive':'negative'}">${signedMoney(m.net,data.profile.baseCurrency)}</b></div><div class="kpi-row"><span class="muted">Win rate</span><b>${pct(m.winRate)}</b></div><div class="split" style="margin-top:14px"><button class="btn btn-sm btn-ghost" onclick="viewPlaybook('${p.id}')">View</button><div><button class="btn btn-sm btn-ghost" onclick="editPlaybook('${p.id}')">Edit</button><button class="btn btn-sm btn-danger" onclick="deletePlaybook('${p.id}')">Delete</button></div></div></article>`}).join('')}</div>`:`<div class="card empty"><div class="empty-icon">◆</div><h3>No playbook setups yet</h3><p>Create the exact models you want AAL Journal to measure. Use the same setup name when logging trades.</p><button class="btn btn-primary" onclick="editPlaybook()">Create first setup</button></div>`}`}
function editPlaybook(id=''){const p=data.playbooks.find(x=>x.id===id)||{id:'',name:'',market:'All',direction:'Both',description:'',entryModel:'',invalidation:'',minRR:2,tags:''};showModal(`<form class="modal sm" onsubmit="savePlaybook(event,'${id}')"><div class="modal-head"><h2>${id?'Edit':'Create'} playbook setup</h2><button type="button" class="icon-btn" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Setup name *</label><input class="input" name="name" required maxlength="80" value="${attr(p.name)}"></div><div class="row"><div class="field"><label>Market</label><select class="select" name="market">${['All','Forex','Indices','Commodities','Crypto','Stocks'].map(x=>`<option ${selected(p.market,x)}>${x}</option>`).join('')}</select></div><div class="field"><label>Direction</label><select class="select" name="direction">${['Both','Long','Short'].map(x=>`<option ${selected(p.direction,x)}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Description</label><textarea class="textarea" name="description">${esc(p.description)}</textarea></div><div class="field"><label>Entry model</label><textarea class="textarea" name="entryModel" placeholder="Example: liquidity sweep → BOS → POI retrace">${esc(p.entryModel)}</textarea></div><div class="field"><label>Invalidation</label><textarea class="textarea" name="invalidation">${esc(p.invalidation)}</textarea></div><div class="row"><div class="field"><label>Minimum planned R</label><input class="input" name="minRR" inputmode="decimal" value="${attr(p.minRR)}"></div><div class="field"><label>Tags</label><input class="input" name="tags" value="${attr(p.tags)}"></div></div><div class="alert alert-info"><b>Core guardrail:</b> every setup still requires Market Structure, Premium/Discount, Liquidity, Supply/Demand, and liquidity taken before BOS.</div></div><div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class= function deleteAccount(id){const a=accountById(id);if(!a)return;const count=data.trades.filter(t=>t.accountId===id).length;if(count)return toast(`Cannot delete this account because ${count} trade record(s) use it. Reassign or delete those trades first.`,'error');if(data.accounts.length===1)return toast('AAL Journal requires at least one trading account.','error');if(!confirm(`Delete account “${a.name}”?`))return;data.accounts=data.accounts.filter(x=>x.id!==id);if(!data.accounts.some(x=>x.active))data.accounts[0].active=true;saveData();toast('Account deleted.','warn');render()}

iv class="field"><label>Default session</label><select class="select" name="defaultSession">${['Asia','London','New York','London / New York overlap','Other'].map(x=>`<option ${selected(data.settings.defaultSession,x)}>${x}</option>`).join('')}</select></div><div class="field"><label>Default risk %</label><input class="input" name="defaultRiskPct" inputmode="decimal" value="${attr(data.settings.defaultRiskPct)}"></div><div class="field"><label>Theme</label><select class="select" name="theme">${['dark','light'].map(x=>`<option ${selected(data.settings.theme,x)}>${x}</option>`).join('')}</select></div></div><label class="checkline" style="margin:12px 0"><input type="checkbox" name="confirmDeletes" ${checked(data.settings.confirmDeletes)}> Confirm before deleting trade records</label><button class="btn btn-primary">Save profile settings</button></form></section><section class="card"><div class="card-head"><h2>Local account</h2></div><div class="card-pad"><div class="avatar" style="width:52px;height:52px;font-size:20px">${esc((data.profile.displayName||'T').slice(0,1).toUpperCase())}</div><h3>${esc(data.profile.displayName)}</h3><div class="small muted">${esc(currentUser.email)}</div><div class="small muted">Created ${prettyDate(getUsers().find(u=>u.id===currentUser.id)?.createdAt)}</div><div class="divider"></div><button class="btn btn-ghost btn-block" onclick="changePasswordModal()">Change local password</button><button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="logout()">Sign out</button></div></section></div><section class="card" style="margin-top:16px"><div class="card-head"><div><h2>Automatic time and date notifications</h2><div class="small muted">Scheduled in ${esc(safeTimeZone(data.profile.timezone))}</div></div>${notificationPermissionBadge()}</div><form class="card-pad" onsubmit="saveNotificationSettings(event)"><div class="alert ${permission==='granted'?'alert-success':permission==='denied'||permission==='unsupported'?'alert-warn':'alert-info'}"><b>Windows notification permission:</b> ${esc(notificationPermissionLabel())}. Automatic reminders use your selected timezone and local calendar date. On Windows, scheduled reminders run while AAL Journal is open. Allow notification permission when prompted; if Windows notifications are unavailable, reminders still appear inside the app.</div><div class="grid grid-2" style="margin-top:16px"><div><label class="checkline" style="font-size:14px"><input type="checkbox" name="notificationsEnabled" ${checked(data.settings.notificationsEnabled)}> <b>Turn on automatic notifications</b></label><label class="checkline" style="margin-top:12px"><input type="checkbox" name="weekdayOnly" ${checked(data.settings.weekdayOnly)}> Run recurring reminders Monday through Friday only</label></div><div class="right"><button type="button" class="btn btn-ghost btn-sm" onclick="requestNotificationPermission()">Allow Windows notifications</button><button type="button" class="btn btn-primary btn-sm" onclick="testTradeOSNotification()">Send test notification</button></div></div><div class="divider"></div><div class="grid grid-3"><div class="card card-pad" style="box-shadow:none"><label class="checkline"><input type="checkbox" name="preMarketEnabled" ${checked(r.preMarket.enabled)}> <b>Pre-market plan</b></label><div class="field" style="margin-top:12px"><label>Notification time</label><input class="input" type="time" name="preMarketTime" value="${attr(r.preMarket.time)}"></div><div class="field"><label>Message</label><textarea class="textarea" name="preMarketBody">${esc(r.preMarket.body)}</textarea></div></div><div class="card card-pad" style="box-shadow:none"><label class="checkline"><input type="checkbox" name="journalEnabled" ${checked(r.journal.enabled)}> <b>Journal reminder</b></label><div class="field" style="margin-top:12px"><label>Notification time</label><input class="input" type="time" name="journalTime" value="${attr(r.journal.time)}"></div><div class="field"><label>Message</label><textarea class="textarea" name="journalBody">${esc(r.journal.body)}</textarea></div></div><div class="card card-pad" style="box-shadow:none"><label class="checkline"><input type="checkbox" name="reviewEnabled" ${checked(r.review.enabled)}> <b>End-of-day review</b></label><div class="field" style="margin-top:12px"><label>Notification time</label><input class="input" type="time" name="reviewTime" value="${attr(r.review.time)}"></div><div class="field"><label>Message</label><textarea class="textarea" name="reviewBody">${esc(r.review.body)}</textarea></div></div></div><div class="divider"></div><div class="grid grid-3"><div><label class="checkline"><input type="checkbox" name="oneTimeEnabled" ${checked(r.oneTime.enabled)}> <b>One-time dated reminder</b></label><div class="small muted" style="margin-top:6px">Fires once, then turns itself off.</div></div><div class="field"><label>Date</label><input class="input" type="date" name="oneTimeDate" value="${attr(r.oneTime.date)}"></div><div class="field"><label>Time</label><input class="input" type="time" name="oneTimeTime" value="${attr(r.oneTime.time)}"></div></div><div class="field"><label>One-time reminder message</label><input class="input" name="oneTimeBody" value="${attr(r.oneTime.body)}" placeholder="Review XAUUSD session and complete journal"></div><div class="split"><div class="small muted">The reminder scheduler checks every 15 seconds while AAL Journal is open.</div><button class="btn btn-primary">Save notification schedule</button></div></form></section><div class="grid grid-3" style="margin-top:16px"><section class="card"><div class="card-head"><h2>Backup</h2></div><div class="card-pad"><p class="small muted">Export all personal journal data, including reminder settings and resized screenshots, as one JSON backup.</p><button class="btn btn-primary btn-block" onclick="exportBackup()">⇩ Export full backup</button><label class="btn btn-ghost btn-block" style="margin-top:9px;cursor:pointer">⇧ Import backup<inp function saveSettings(e){e.preventDefault();const f=new FormData(e.target),get=k=>String(f.get(k)||'').trim(),requestedZone=get('timezone');if(requestedZone!==safeTimeZone(requestedZone))return toast('Select a valid IANA timezone.','error');data.profile.displayName=get('displayName')||'Trader';data.profile.timezone=requestedZone;data.profile.baseCurrency=get('baseCurrency');data.settings.timeFormat=get('timeFormat')||'12h';data.settings.dateFormat=get('dateFormat')||'medium';data.settings.defaultSession=get('defaultSession');data.settings.defaultRiskPct=num(get('defaultRiskPct'),1);data.settings.theme=get('theme');data.settings.confirmDeletes=f.get('confirmDeletes')==='on';const users=getUsers(),u=users.find(x=>x.id===currentUser.id);if(u){u.name=data.profile.displayName;setUsers(users);currentUser.name=u.name}storage.setItem('tradeos_theme',data.settings.theme);saveData();applyTheme();startClock();startNotificationScheduler();toast('Profile, timezone, and clock settings saved.');render()}
async function saveNotificationSettings(e){e.preventDefault();const f=new FormData(e.target),get=k=>String(f.get(k)||'').trim(),wants=f.get('notificationsEnabled')==='on';if(wants&&notificationPermissionState()==='default')await requestNotificationPermission(false);data.settings.notificationsEnabled=wants;data.settings.weekdayOnly=f.get('weekdayOnly')==='on';const r=data.settings.reminders;r.preMarket={enabled:f.get('preMarketEnabled')==='on',time:get('preMarketTime')||'07:30',body:get('preMarketBody')||defaultReminderSettings().reminders.preMarket.body};r.journal={enabled:f.get('journalEnabled')==='on',time:get('journalTime')||'17:30',body:get('journalBody')||defaultReminderSettings().reminders.journal.body};r.review={enabled:f.get('reviewEnabled')==='on',time:get('reviewTime')||'20:30',body:get('reviewBody')||defaultReminderSettings().reminders.review.body};const oneEnabled=f.get('oneTimeEnabled')==='on';r.oneTime={enabled:oneEnabled,date:get('oneTimeDate'),time:get('oneTimeTime'),body:get('oneTimeBody')||defaultReminderSettings().reminders.oneTime.body};if(oneEnabled&&(!r.oneTime.date||!r.oneTime.time)){r.oneTime.enabled=false;saveData();return toast('Choose both a date and time for the one-time reminder.','error')}saveData();startNotificationScheduler();const permission=notificationPermissionState();if(wants&&permission!=='granted')toast('Schedule saved. System notifications are blocked or unavailable, so reminders will appear inside AAL Journal while it is open.','warn',6500);else toast(wants?'Automatic notifications are on.':'Automatic notifications are off.');render()}
function wireImport(){const input=$('#backup-file');if(input)input.addEventListener('change',async()=>{const file=input.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());const incoming=parsed.data||parsed;if(!incoming||!Array.isArray(incoming.trades)||!Array.isArray(incoming.accounts))throw new Error('Invalid AAL Journal backup');if(!confirm(`Import backup with ${incoming.trades.length} trades? This replaces the current workspace.`))return;data=migrateData(incoming);saveData();applyTheme();toast('Backup imported successfully.');render()}catch(err){toast(err.message||'Backup import failed.','error')}})}
function exportBackup(){const payload={app:'AAL Journal',version:APP_VERSION,exportedAt:new Date().toISOString(),user:{name:data.profile.displayName,email:currentUser.email},data};download(`AAL_Journal_backup_${todayInZone()}.json`,JSON.stringify(payload,null,2));toast('Full backup exported.')}
function storageSize(){const raw=storage.getItem(dataKey(currentUser.id))||'';const bytes=new Blob([raw]).size;return bytes<1024?bytes+' B':bytes<1024*1024?(bytes/1024).toFixed(1)+' KB':(bytes/1024/1024).toFixed(2)+' MB'}
function resetWorkspace(){if(!confirm('Reset the entire journal workspace? This deletes trades, playbooks, psychology entries, reviews, and account settings for this local user.'))return;if(!confirm('Final confirmation: have you exported a backup?'))return;data=defaultData();saveData();toast('Workspace reset.','warn');ui.page='dashboard';render()}

function cloudReady(){return !!sbClient}
function cloudStatusText(){if(!cloudReady())return 'Supabase client is not configured. Add your anon public key in index.html.';if(cloudSession&&cloudUser)return `Connected as ${cloudUser.email}`;return 'Not connected to Supabase.'}
function renderCloudSync(){const configured=cloudReady();return pageHead('Cloud Sync','Connect this local AAL Journal to Supabase so your trades can be backed up and accessed across devices.')+`<div class="grid grid-2"><section class="card"><div class="card-head"><h2>Supabase connection</h2><span class="badge ${configured?'badge-valid':'badge-warn'}">${configured?'Configured':'Needs anon key'}</span></div><div class="card-pad"><div class="alert ${configured?'alert-info':'alert-warn'}"><b>Status:</b> ${esc(cloudStatusText())}</div>${cloudSession?`<div class="field" style="margin-top:14px"><label>Connected account</label><input class="input" value="${esc(cloudUser.email)}" disabled></div><div class="row"><button class="btn btn-primary" onclick="syncLocalTradesToCloud()">☁ Upload local trades</button><button class="btn btn-ghost" onclick="loadCloudTrades()">↻ Pull cloud trades</button><button class="btn btn-danger" onclick="cloudSignOut()">Sign out cloud</button></div>`:`<div class="auth-tabs" style="margin-top:16px"><button class="active" id="cloud-login-tab" onclick="setCloudAuthMode('login')">Sign in</button><button id="cloud-signup-tab" onclick="setCloudAuthMode('signup')">Sign up</button></div><div id="cloud-auth-box">${renderCloudAuthForm('login')}</div>`}<div class="small muted" style="margin-top:14px">Use the Supabase <b>anon public</b> key only. Never put the service_role key in this app.</div></div></section><section class="card"><div class="card-head"><h2>Cloud trades</h2><span id="cloud-count" class="badge badge-neutral">0</span></div><div class="card-pad"><div id="cloud-trades-list"><div class="small muted">Sign in and pull cloud trades.</div></div></div></section></div>`}
let cloudAuthMode='login';
function setCloudAuthMode(mode){cloudAuthMode=mode;const box=$('#cloud-auth-box');if(box)box.innerHTML=renderCloudAuthForm(mode);$('#cloud-login-tab')?.classList.toggle('active',mode==='login');$('#cloud-signup-tab')?.classList.toggle('active',mode==='signup')}
function renderCloudAuthForm(mode){return mode==='login'?`<form onsubmit="cloudSignIn(event)"><div class="field"><label>Email</label><input class="input" name="email" type="email" required></div><div class="field"><label>Password</label><input class="input" name="password" type="password" required minlength="6"></div><button class="btn btn-primary btn-block">Sign in to Supabase</button></form>`:`<form onsubmit="cloudSignUp(event)"><div class="field"><label>Email</label><input class="input" name="email" type="email" required></div><div class="field"><label>Password</label><input class="input" name="password" type="password" required minlength="6"></div><button class="btn btn-primary btn-block">Create Supabase account</button></form>`}
async function refreshCloudStatus(){if(!sbClient)return;try{const r=await sbClient.auth.getSession();cloudSession=r.data.session||null;cloudUser=cloudSession?.user||null;if(cloudUser)loadCloudTrades()}catch(e){console.error(e)}}
async function cloudSignIn(e){e.preventDefault();if(!sbClient)return toast('Configure the Supabase anon key first.','error');const f=new FormData(e.target);const {data,error}=await sbClient.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('password'))});if(error)return toast(error.message,'error',6000);cloudSession=data.session;cloudUser=data.user;toast('Supabase cloud connected.','success');render()}
async function cloudSignUp(e){e.preventDefault();if(!sbClient)return toast('Configure the Supabase anon key first.','error');const f=new FormData(e.target);const {data,error}=await sbClient.auth.signUp({email:String(f.get('email')).trim(),password:String(f.get('password'))});if(error)return toast(error.message,'error',6000);cloudSession=data.session;cloudUser=data.user;if(!cloudSession)toast('Account created. Check your email if email confirmation is enabled in Supabase.','info',7000);else toast('Supabase account created and connected.','success');render()}
async function cloudSignOut(){if(sbClient)await sbClient.auth.signOut();cloudSession=null;cloudUser=null;toast('Supabase cloud signed out.','info');render()}
async function uploadCloudScreenshot(dataUrl,userId,tradeId,slot){if(!sbClient||!dataUrl||!dataUrl.startsWith('data:'))return null;const res=await fetch(dataUrl);const blob=await res.blob();const path=`${userId}/${tradeId}/${slot}.jpg`;const up=await sbClient.storage.from('trade-screenshots').upload(path,blob,{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;const pub=sbClient.storage.from('trade-screenshots').getPublicUrl(path);return pub.data.publicUrl}
function mapLocalTradeToCloud(t,uid){return{user_id:uid,pair:t.symbol,direction:t.direction,entry_price:t.entryPrice,sl_price:t.stopLoss,tp_price:t.takeProfit,notes:JSON.stringify({setup:t.setup,strategyVersion:t.strategyVersion,session:t.session,thesis:t.thesis,entryReason:t.entryReason,exitReason:t.exitReason,wentWell:t.wentWell,wentWrong:t.wentWrong,lesson:t.lesson,tags:t.tags,checklist:t.checklist,psychology:{before:t.emotionBefore,after:t.emotionAfter}}),screenshot_url:t.attachments?.entry||t.attachments?.before||t.attachments?.after||null,risk_reward:t.plannedRR,created_at:t.createdAt||new Date().toISOString()}}
async function syncOneTradeToCloud(t){if(!sbClient||!cloudUser)return;const row=mapLocalTradeToCloud(t,cloudUser.id);if(t.attachments?.before)row.screenshot_url=await uploadCloudScreenshot(t.attachments.before,cloudUser.id,t.id,'before');if(t.attachments?.entry)row.screenshot_url=await uploadCloudScreenshot(t.attachments.entry,cloudUser.id,t.id,'entry');if(t.attachments?.after)row.screenshot_url=await uploadCloudScreenshot(t.attachments.after,cloudUser.id,t.id,'after');const {error}=await sbClient.from('trades').upsert(row,{onConflict:'user_id,created_at'});if(error)throw error}
async function syncLocalTradesToCloud(){if(!sbClient||!cloudUser)return toast('Sign in to Supabase first.','error');const trades=data?.trades||[];if(!trades.length)return toast('No local trades to upload.','warn');let ok=0;for(const t of trades){try{await syncOneTradeToCloud(t);ok++}catch(err){console.error('Cloud sync failed',t.id,err)}}toast(`Cloud sync finished: ${ok}/${trades.length} trades uploaded.`,ok===trades.length?'success':'warn',7000);loadCloudTrades()}
async function loadCloudTrades(){if(!sbClient||!cloudUser)return;const box=$('#cloud-trades-list');if(box)box.innerHTML='<div class="small muted">Loading…</div>';const {data:rows,error}=await sbClient.from('trades').select('*').eq('user_id',cloudUser.id).order('created_at',{ascending:false}).limit(100);if(error){if(box)box.innerHTML=`<div class="alert alert-danger">${esc(error.message)}</div>`;return}if($('#cloud-count'))$('#cloud-count').textContent=String(rows.length);if(box)box.innerHTML=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Pair</th><th>Dir</th><th>Entry</th><th>SL</th><th>TP</th><th>R:R</th><th>Created</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.pair||'')}</b></td><td>${esc(r.direction||'')}</td><td>${esc(r.entry_price??'')}</td><td>${esc(r.sl_price??'')}</td><td>${esc(r.tp_price??'')}</td><td>${esc(r.risk_reward??'')}</td><td>${esc(new Date(r.created_at).toLocaleString())}</td></tr>`).join('')}</tbody></table></div>`:'<div class="small muted">No cloud trades yet.</div>'}
async function changePasswordModal(){showModal(`<form class="modal sm" onsubmit="changePassword(event)"><div class="modal-head"><h2>Change local password</h2><button type="button" class="icon-btn" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Current password</label><input class="input" name="current" type="password" required></div><div class="field"><label>New password</label><input class="input" name="next" type="password" minlength="8" required></div><div class="field"><label>Confirm new password</label><input class="input" name="confirm" type="password" minlength="8" required></div></div><div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Update password</button></div></form>`)}
async function changePassword(e){e.preventDefault();const f=new FormData(e.target);const current=String(f.get('current')),next=String(f.get('next')),confirmPass=String(f.get('confirm'));if(next!==confirmPass)return toast('New passwords do not match.','error');const users=getUsers(),u=users.find(x=>x.id===currentUser.id);if(!u||u.passwordHash!==await sha256(current))return toast('Current password is incorrect.','error');u.passwordHash=await sha256(next);setUsers(users);closeModal();toast('Password changed.')}
function deleteLocalAccount(){if(!confirm('Delete this local AAL Journal account and all of its browser data?'))return;const typed=prompt(`Type DELETE to permanently remove ${currentUser.email}`);if(typed!=='DELETE')return;const id=currentUser.id;setUsers(getUsers().filter(u=>u.id!==id));storage.removeItem(dataKey(id));storage.removeItem(KEYS.session);sessionStore.removeItem(KEYS.session);currentUser=null;data=null;closeModal();render();toast('Local account deleted.','warn')}
function showModal(html){$('#modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">${html}</div>`}
function closeModal(){$('#modal-root').innerHTML=''}
init();
if(sbClient){sbClient.auth.onAuthStateChange((_event,session)=>{cloudSession=session||null;cloudUser=session?.user||null;if(currentUser&&ui.page==='cloud-sync')setTimeout(()=>render(),0)})}
</script>

<script>
(function(){
  function removeSplash(){
    var s=document.getElementById('aal-native-splash');
    if(s){s.style.opacity='0';setTimeout(function(){if(s&&s.parentNode)s.parentNode.removeChild(s)},320)}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(removeSplash,650)});
  else setTimeout(removeSplash,650);
})();
</script>
