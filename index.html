<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0a0c">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; img-src 'self' data: blob: https://*.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://eaawrkatfuhoqmqvphdk.supabase.co wss://eaawrkatfuhoqmqvphdk.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>Formidable Trading Workspace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" href="ft-monogram-red.svg" type="image/jpeg">
<style>
:root{
  --bg: #0a0a0c;
  --surface: #121216;
  --surface2: #1b1b22;
  --surface3: #262630;
  --border: #2e2e38;
  --border2: #424250;
  --text: #f8fafc;
  --muted: #94a3b8;
  --faint: #64748b;
  --brand: #dc2626;
  --brand-hover: #b91c1c;
  --brand-light: rgba(220, 38, 38, 0.12);
  --long: #10b981;
  --short: #ef4444;
  --warn: #f59e0b;
  --purple: #dc2626;
  --shadow: 0 20px 50px rgba(0,0,0,.5);
  --radius: 14px;
  --sidebar: 260px;
  --topbar: 68px;
}
html[data-theme="light"]{
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface2: #f1f5f9;
  --surface3: #e2e8f0;
  --border: #cbd5e1;
  --border2: #94a3b8;
  --text: #0f172a;
  --muted: #475569;
  --faint: #64748b;
  --brand: #dc2626;
  --brand-hover: #b91c1c;
  --brand-light: rgba(220, 38, 38, 0.08);
  --shadow: 0 20px 40px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.positive{color:var(--long)!important}
.negative{color:var(--short)!important}
.warning{color:var(--warn)!important}
.danger{color:var(--short)!important}
.nowrap{white-space:nowrap}
.right{text-align:right}
.center{text-align:center}
.small{font-size:13px}
.tiny{font-size:11px}
.caps{text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:700}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:999px;border:2px solid transparent;background-clip:padding-box}

/* Cloud / Supabase Header Indicator */
.cloud-bar{position:fixed;top:0;left:0;right:0;height:28px;background:linear-gradient(90deg,var(--surface2),var(--surface3));border-bottom:1px solid var(--border);z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:11px}
.cloud-pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}

/* Auth Shell */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:radial-gradient(circle at 10% 20%,rgba(220,38,38,.12),transparent 40%),radial-gradient(circle at 90% 80%,rgba(100,116,139,.1),transparent 40%),var(--bg)}
.auth-hero{padding:80px 64px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.01em;font-size:18px}
.brand-mark{width:42px;height:42px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:white;box-shadow:0 10px 25px rgba(0,0,0,.4);overflow:hidden;border:1px solid var(--border2)}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.hero-title{font-size:clamp(36px,4.8vw,64px);line-height:1.08;margin:24px 0;max-width:700px}
.hero-title span{background:linear-gradient(90deg,#f8fafc,#dc2626);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-copy{font-size:16px;color:var(--muted);max-width:600px;line-height:1.7}
.hero-features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.feature-chip{padding:18px;border:1px solid var(--border);background:var(--surface);border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.04)}
.feature-chip b{display:block;margin-bottom:6px;font-size:14px}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:40px}
.auth-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:36px;box-shadow:var(--shadow)}
.auth-tabs{display:flex;gap:6px;padding:4px;background:var(--surface2);border-radius:12px;margin:24px 0}
.auth-tabs button{flex:1;padding:10px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13px;transition:.2s}
.auth-tabs button.active{background:var(--surface);color:var(--text);box-shadow:0 4px 12px rgba(0,0,0,.08)}

/* Fields & Forms */
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.input,.select,.textarea{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:12px;padding:12px 14px;outline:none;transition:.2s;font-size:14px}
.textarea{min-height:100px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-light)}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.row{display:flex;gap:14px}
.row>*{flex:1}
.checkline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;cursor:pointer}
.checkline input{accent-color:var(--brand);width:18px;height:18px;border-radius:4px}

/* Buttons */
.btn{border:1px solid transparent;background:var(--surface2);padding:11px 18px;border-radius:12px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s;font-size:13px;text-decoration:none}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--brand),#b91c1c);color:#fff;box-shadow:0 4px 14px rgba(220,38,38,.25)}
.btn-success{background:var(--long);color:#fff}
.btn-danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#fca5a5}
.btn-warn{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3);color:#fbbf24}
.btn-ghost{background:transparent;border-color:var(--border)}
.btn-ghost:hover{background:var(--surface2)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn-block{width:100%}
.link-btn{border:0;background:transparent;color:var(--brand);cursor:pointer;padding:0;font-weight:700}
.link-btn:hover{text-decoration:underline}
.divider{height:1px;background:var(--border);margin:20px 0}

/* Alerts */
.alert{padding:14px 16px;border:1px solid var(--border);border-radius:12px;font-size:13px;line-height:1.5}
.alert-info{background:var(--brand-light);border-color:color-mix(in srgb,var(--brand) 30%,var(--border))}
.alert-warn{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:#fde68a}
.alert-danger{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fecaca}
.alert-success{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:#a7f3d0}

/* App OS Shell */
.os-shell{min-height:100vh;padding-top:28px}
.sidebar{position:fixed;inset:28px auto 0 0;width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:30}
.sidebar-head{height:var(--topbar);display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--border)}
.sidebar-nav{padding:16px 12px;overflow-y:auto;flex:1}
.nav-section{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.15em;padding:16px 12px 8px;font-weight:800}
.nav-item{width:100%;border:0;background:transparent;color:var(--muted);padding:10px 12px;margin:3px 0;border-radius:10px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;font-size:13px;font-weight:650;transition:.15s}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--brand-light);color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 30%,var(--border))}
.nav-icon{width:22px;text-align:center;font-size:16px}
.sidebar-foot{padding:14px;border-top:1px solid var(--border)}
.user-card{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--surface2);border:1px solid var(--border)}
.avatar{width:36px;height:36px;border-radius:10px;background:var(--brand);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}

.main{margin-left:var(--sidebar);min-height:calc(100vh - 28px)}
.topbar{height:var(--topbar);position:sticky;top:28px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.topbar-left,.topbar-right{display:flex;align-items:center;gap:12px}
.page-wrap{padding:32px;max-width:1700px;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px}
.page-head h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.page-head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);display:grid;place-items:center;cursor:pointer;transition:.2s}
.icon-btn:hover{border-color:var(--brand);background:var(--brand-light)}
.mobile-menu{display:none}

/* Grid Layouts & Cards */
.grid{display:grid;gap:20px}
.grid>*{min-width:0}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span-2{grid-column:span 2}
.span-3{grid-column:span 3}
.card{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:22px}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
.card-head h2,.card-head h3{font-size:15px;font-weight:700;margin:0}

/* Metrics */
.metric-card{padding:22px;position:relative;overflow:hidden}
.metric-label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.metric-value{font-size:30px;font-weight:850;margin:10px 0 6px;letter-spacing:-.03em}
.metric-sub{font-size:12px;color:var(--faint)}
.metric-icon{position:absolute;right:18px;top:18px;width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;color:var(--brand);font-weight:700}

/* Tables & Badges */
.table-wrap{overflow:auto;max-width:100%;border-radius:var(--radius)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{padding:12px 16px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:var(--surface2);text-align:left;white-space:nowrap;font-weight:700}
.table td{padding:14px 16px;border-top:1px solid var(--border);vertical-align:middle}
.table tbody tr{transition:.15s}
.table tbody tr:hover{background:var(--surface2)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--border);white-space:nowrap}
.badge-long,.badge-win,.badge-valid{background:rgba(16,185,129,.12);color:#34d399;border-color:rgba(16,185,129,.3)}
.badge-short,.badge-loss,.badge-invalid{background:rgba(239,68,68,.12);color:#f87171;border-color:rgba(239,68,68,.3)}
.badge-warn,.badge-open{background:rgba(245,158,11,.12);color:#fbbf24;border-color:rgba(245,158,11,.3)}
.badge-neutral{background:var(--surface2);color:var(--muted)}

.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.toolbar .input,.toolbar .select{width:auto;min-width:160px;padding:10px 14px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .empty-icon{font-size:48px;margin-bottom:14px;color:var(--brand)}
.empty h3{color:var(--text);margin:0 0 8px;font-size:18px}
.empty p{max-width:480px;margin:0 auto 20px;line-height:1.6}
.progress{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress>span{height:100%;display:block;background:linear-gradient(90deg,var(--brand),#b91c1c);border-radius:99px}
.split{display:flex;justify-content:space-between;align-items:center;gap:14px}
.list{display:flex;flex-direction:column}
.list-item{padding:16px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:0}
.kpi-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}
.kpi-row:last-child{border-bottom:0}

/* Charts & Bars */
.chart{width:100%;min-height:260px}
.chart svg{width:100%;height:270px;display:block}
.chart-grid{stroke:var(--border);stroke-width:1}
.chart-line{fill:none;stroke:var(--brand);stroke-width:2.5}
.chart-area{fill:url(#areaGrad)}
.chart-label{fill:var(--faint);font-size:11px}
.bar-list{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(100px,160px) 1fr 80px;gap:14px;align-items:center;font-size:13px}
.bar-track{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--brand)}
.bar-fill.pos{background:var(--long)}
.bar-fill.neg{background:var(--short)}

/* Form Layouts & Checklist */
.form-section{padding:22px;border-bottom:1px solid var(--border)}
.form-section:last-child{border-bottom:0}
.form-section h3{margin:0 0 16px;font-size:15px;font-weight:700}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.form-grid .field{margin:0}
.checklist{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.check-card{border:1px solid var(--border);background:var(--surface2);padding:14px;border-radius:12px;cursor:pointer;min-height:115px;display:flex;flex-direction:column;gap:10px;transition:.2s}
.check-card:hover{border-color:var(--brand)}
.check-card.checked{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.06)}
.check-card b{font-size:13px}
.check-card span{font-size:11px;color:var(--muted);line-height:1.4}
.verdict{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface2)}
.verdict.good{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08)}
.verdict.bad{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08)}
.attachment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.attachment-slot{border:2px dashed var(--border2);border-radius:14px;padding:14px;text-align:center;min-height:130px;display:grid;place-items:center;overflow:hidden;background:var(--surface2)}
.attachment-slot img{width:100%;height:120px;object-fit:cover;border-radius:10px}
.file-label{cursor:pointer;color:var(--brand);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.file-label input{display:none}

/* Calendar & Setup Cards */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.cal-head{background:var(--surface2);padding:12px;text-align:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.cal-day{background:var(--surface);min-height:115px;padding:10px;cursor:pointer;position:relative;transition:.15s}
.cal-day:hover{background:var(--surface2)}
.cal-day.out{opacity:.35}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--brand)}
.cal-num{font-size:12px;font-weight:800}
.cal-pnl{font-size:13px;font-weight:800;margin-top:16px}
.cal-count{font-size:11px;color:var(--faint);margin-top:4px}
.cal-note{position:absolute;right:10px;top:10px;color:var(--warn)}

.setup-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.setup-card{padding:20px;border:1px solid var(--border);background:var(--surface);border-radius:14px}
.setup-card h3{margin:0 0 8px;font-size:16px}
.score-ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brand) var(--score),var(--surface2) 0);position:relative}
.score-ring:before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.score-ring span{position:relative;font-size:13px;font-weight:850}
.mood{font-size:28px}

/* Modals & Toasts */
.modal-backdrop{position:fixed;inset:0;background:rgba(5,5,8,.8);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(940px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border2);border-radius:20px;box-shadow:var(--shadow)}
.modal.sm{width:min(560px,100%)}
.modal.lg{width:min(1240px,100%)}
.modal-head{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:17px;font-weight:800;margin:0}
.modal-body{padding:22px}
.modal-foot{position:sticky;bottom:0;background:var(--surface);display:flex;justify-content:flex-end;gap:12px;padding:16px 22px;border-top:1px solid var(--border)}

.toast-stack{position:fixed;right:20px;top:40px;z-index:200;display:flex;flex-direction:column;gap:12px}
.toast{width:min(380px,calc(100vw - 40px));padding:14px 16px;background:var(--surface);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start;animation:toastIn .25s cubic-bezier(0.16, 1, 0.3, 1)}
.toast.success{border-left:4px solid var(--long)}
.toast.error{border-left:4px solid var(--short)}
.toast.warn{border-left:4px solid var(--warn)}
@keyframes toastIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

/* Command Palette */
.command{width:min(660px,100%);margin-top:12vh;align-self:flex-start}
.command-search{width:100%;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--text);padding:20px;font-size:18px;outline:none}
.command-list{padding:10px;max-height:440px;overflow:auto}
.command-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:10px;cursor:pointer;transition:.15s}
.command-item:hover,.command-item.active{background:var(--surface2)}
.kbd{padding:3px 8px;border:1px solid var(--border2);border-bottom-width:2px;border-radius:6px;font-size:11px;color:var(--muted);background:var(--bg)}

.bottom-dock{display:none}
.print-only{display:none}

@media(max-width:1200px){.grid-5{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}.checklist{grid-template-columns:repeat(3,1fr)}.setup-cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  :root{--sidebar:0px}
  .auth-wrap{grid-template-columns:1fr}
  .auth-hero{display:none}
  .auth-panel{min-height:100vh}
  .sidebar{transform:translateX(-100%);width:260px;transition:.25s;top:28px;bottom:0}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .mobile-menu{display:grid}
  .topbar{padding:0 16px;top:28px}
  .page-wrap{padding:20px 16px 90px}
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .bottom-dock{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:40;padding:8px env(safe-area-inset-right) calc(8px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
  .dock-item{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:6px;font-weight:600}

async function pullFromCloud(){
  if(!sbClient||!cloudUser)return;
  try{
    const {data:rows,error}=await sbClient.from('journal_workspaces').select('payload').eq('user_id',cloudUser.id).single();
    if(rows&&rows.payload){
      data=rows.payload;
      toast('Workspace synced from Supabase Cloud.','success');
    }else{
      await pushToCloud();
    }
  }catch(err){
    console.warn('Could not fetch workspace from cloud, using default/local sync',err);
  }
  render();
}

async function pushToCloud(){
  if(!sbClient||!cloudUser)return;
  try{
    data.updatedAt=new Date().toISOString();
    const {error}=await sbClient.from('journal_workspaces').upsert({
      user_id:cloudUser.id,
      payload:data,
      updated_at:data.updatedAt
    },{onConflict:'user_id'});
    if(error)console.error('Cloud push error:',error);
  }catch(e){
    console.error('Failed pushing to cloud:',e);
  }
}

/* Metrics Engine */
function metrics(trades=data?.trades||[]){
  const closed=trades.filter(t=>t.status==='closed'&&Number.isFinite(Number(t.realizedPnl))).sort((a,b)=>new Date(a.exitTime||a.tradeDate)-new Date(b.exitTime||b.tradeDate));
  const pnl=closed.map(t=>num(t.realizedPnl));
  const wins=closed.filter(t=>num(t.realizedPnl)>.01);
  const losses=closed.filter(t=>num(t.realizedPnl)<-.01);
  const bes=closed.filter(t=>Math.abs(num(t.realizedPnl))<=.01);
  const gp=wins.reduce((s,t)=>s+num(t.realizedPnl),0);
  const gl=Math.abs(losses.reduce((s,t)=>s+num(t.realizedPnl),0));
  const decided=wins.length+losses.length;
  const wr=decided?wins.length/decided*100:0;
  const lr=decided?losses.length/decided*100:0;
  const avgWin=wins.length?gp/wins.length:0;
  const avgLoss=losses.length?gl/losses.length:0;
  const pf=gl?gp/gl:(gp?Infinity:0);
  const expectancy=(wr/100*avgWin)-(lr/100*avgLoss);
  
  let equity=0,peak=0,maxDD=0;
  const curve=closed.map(t=>{
    equity+=num(t.realizedPnl);
    peak=Math.max(peak,equity);
    maxDD=Math.max(maxDD,peak-equity);
    return{date:t.exitTime||t.tradeDate,value:equity,drawdown:peak-equity};
  });

  let currentWin=0,currentLoss=0,longestWin=0,longestLoss=0,w=0,l=0;
  closed.forEach(t=>{
    const p=num(t.realizedPnl);
    if(p>.01){w++;l=0;longestWin=Math.max(longestWin,w)}
    else if(p<-.01){l++;w=0;longestLoss=Math.max(longestLoss,l)}
    else{w=0;l=0}
  });
  for(let i=closed.length-1;i>=0;i--){
    const p=num(closed[i].realizedPnl);
    if(p>.01&&!currentLoss)currentWin++;
    else if(p<-.01&&!currentWin)currentLoss++;
    else break;
  }

  const compliant=closed.filter(allChecklist);
  const noncompliant=closed.filter(t=>!allChecklist(t));
  const avg=(arr,key)=>arr.length?arr.reduce((s,t)=>s+num(t[key]),0)/arr.length:0;

  return{
    closed,total:closed.length,net:pnl.reduce((a,b)=>a+b,0),grossProfit:gp,grossLoss:gl,
    wins:wins.length,losses:losses.length,breakeven:bes.length,winRate:wr,lossRate:lr,
    avgWin,avgLoss,profitFactor:pf,expectancy,avgPlannedR:avg(closed,'plannedRR'),avgRealizedR:avg(closed,'realizedR'),
    maxDrawdown:maxDD,currentWin,currentLoss,longestWin,longestLoss,
    complianceRate:closed.length?compliant.length/closed.length*100:0,
    compliantExpectancy:compliant.length?compliant.reduce((s,t)=>s+num(t.realizedPnl),0)/compliant.length:0,
    noncompliantExpectancy:noncompliant.length?noncompliant.reduce((s,t)=>s+num(t.realizedPnl),0)/noncompliant.length:0,
    checklistEdge:(compliant.length?compliant.reduce((s,t)=>s+num(t.realizedPnl),0)/compliant.length:0)-(noncompliant.length?noncompliant.reduce((s,t)=>s+num(t.realizedPnl),0)/noncompliant.length:0),
    curve
  };
}

function groupPerformance(trades,key){
  const map={};
  trades.filter(t=>t.status==='closed').forEach(t=>{
    let k;
    if(key==='weekday')k=new Date(t.exitTime||(t.tradeDate+'T12:00:00')).toLocaleDateString(undefined,{weekday:'short'});
    else if(key==='compliance')k=allChecklist(t)?'Compliant (5/5)':'Noncompliant';
    else k=t[key]||'Unspecified';
    (map[k]??=[]).push(t);
  });
  return Object.entries(map).map(([name,arr])=>{
    const m=metrics(arr);
    return{name,trades:m.total,net:m.net,winRate:m.winRate,expectancy:m.expectancy,pf:m.profitFactor};
  }).sort((a,b)=>b.net-a.net);
}

function filteredTrades(){
  return data.trades.filter(t=>{
    const h=ui.history;
    const q=h.q.trim().toLowerCase();
    if(q&&!`${t.symbol} ${t.setup} ${t.tags} ${t.entryReason}`.toLowerCase().includes(q))return false;
    if(h.account!=='all'&&t.accountId!==h.account)return false;
    if(h.result!=='all'&&resultOf(t)!==h.result)return false;
    if(h.compliance!=='all'&&String(allChecklist(t))!==h.compliance)return false;
    return true;
  }).sort((a,b)=>{
    if(ui.history.sort==='date-asc')return new Date(a.tradeDate)-new Date(b.tradeDate);
    if(ui.history.sort==='pnl-desc')return num(b.realizedPnl)-num(a.realizedPnl);
    if(ui.history.sort==='pnl-asc')return num(a.realizedPnl)-num(b.realizedPnl);

  });
}

function equitySvg(curve,height=270){
  if(!curve.length)return'<div class="empty">No closed-trade equity data yet.</div>';
  const w=900,h=height,p=32;
  const vals=[0,...curve.map(x=>x.value)];
  const min=Math.min(...vals),max=Math.max(...vals);
  const range=max-min||1;
  const pts=curve.map((x,i)=>{
    const xx=p+(i/(Math.max(1,curve.length-1)))*(w-p*2);
    const yy=h-p-((x.value-min)/range)*(h-p*2);
    return`${xx.toFixed(1)},${yy.toFixed(1)}`;
  }).join(' ');
  const zeroY=h-p-((0-min)/range)*(h-p*2);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".35"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>${[.25,.5,.75].map(r=>`<line class="chart-grid" x1="${p}" y1="${p+(h-2*p)*r}" x2="${w-p}" y2="${p+(h-2*p)*r}"/>`).join('')}<line x1="${p}" y1="${zeroY}" x2="${w-p}" y2="${zeroY}" stroke="var(--border2)" stroke-dasharray="5 5"/><polygon class="chart-area" points="${p},${h-p} ${pts} ${w-p},${h-p}"/><polyline class="chart-line" points="${pts}"/><text class="chart-label" x="${p}" y="16">${money(max,data.profile.baseCurrency)}</text><text class="chart-label" x="${p}" y="${h-6}">${money(min,data.profile.baseCurrency)}</text></svg>`;
}

function attachmentSlot(key,label){

function wireTradeForm(){
  const form=$('#trade-form');if(!form)return;
  $$('.calc',form).forEach(el=>el.addEventListener('input',updateTradeCalculations));
  $$('.rule-check',form).forEach(el=>el.addEventListener('change',updateChecklistUI));
}

function updateChecklistUI(){
  const form=$('#trade-form');if(!form)return;
  const names=['marketStructure','premiumDiscount','liquidity','supplyDemand','liquidityBeforeBos'];
  const values=names.map(n=>form.elements[n].checked);
  names.forEach((n,i)=>$(`[data-check-card="${n}"]`)?.classList.toggle('checked',values[i]));
  const count=values.filter(Boolean).length;
  const complete=count===5;
  const v=$('#setup-verdict');
  v.className='verdict '+(complete?'good':'bad');
  v.querySelector('b').textContent=complete?'Valid Setup — All 5 Institutional Rules Confirmed.':'Incomplete Setup Guardrail.';
  $('#setup-score').textContent=count+'/5';
  $('#setup-score').className='badge '+(complete?'badge-valid':'badge-warn');
  const missing=names.filter((_,i)=>!values[i]).map(n=>({marketStructure:'Market Structure',premiumDiscount:'Premium/Discount',liquidity:'Liquidity',supplyDemand:'Supply/Demand',liquidityBeforeBos:'Liquidity before BOS'}[n]));
  $('#setup-missing').textContent=complete?'Checklist passed successfully.':'Missing: '+missing.join(', ')+'.';
}

function updateTradeCalculations(){
  const f=$('#trade-form');if(!f)return;
  const entry=strictNum(f.elements.entryPrice.value),sl=strictNum(f.elements.stopLoss.value),tp=strictNum(f.elements.takeProfit.value),exit=strictNum(f.elements.exitPrice.value),size=strictNum(f.elements.positionSize.value),pv=Number.isFinite(strictNum(f.elements.pointValue.value))?strictNum(f.elements.pointValue.value):1,fees=num(f.elements.commission.value)+num(f.elements.otherFees.value);
  const bal=num(f.elements.balanceBefore.value);
  if([entry,sl,size,pv].every(Number.isFinite)){
    const risk=Math.abs(entry-sl)*size*pv;
    $('#riskAmount').value=round(risk,2);
    if(bal)$('#riskPct').value=round(risk/bal*100,2);
    if(Number.isFinite(tp)){
      const reward=Math.abs(tp-entry)*size*pv;
      $('#plannedReward').value=round(reward,2);
      $('#plannedRR').value=risk?round(reward/risk,2):0;
    }
    if(Number.isFinite(exit)){
      const dir=f.elements.direction.value==='long'?1:-1;
      const pnl=(exit-entry)*dir*size*pv-fees;
      $('#realizedPnl').value=round(pnl,2);
      $('#realizedR').value=risk?round(pnl/risk,2):0;
    }
  }
}

async function handleAttachment(key,file){
  if(!file||!file.type.startsWith('image/'))return toast('Only image files are supported.','error');
  if(file.size>12*1024*1024)return toast('Image is too large (max 12MB).','error');
  try{
    ui.pendingAttachments[key]=await compressImage(file,1280,.8);
    const slot=$('#slot-'+key);
    if(slot)slot.outerHTML=attachmentSlot(key,key[0].toUpperCase()+key.slice(1)+' image');
    toast('Screenshot attached.');
  }catch{toast('Could not process image.','error')}
}

function compressImage(file,max=1280,quality=.8){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function removeAttachment(key){
  ui.pendingAttachments[key]=null;
  const slot=$('#slot-'+key);
  if(slot)slot.outerHTML=attachmentSlot(key,key[0].toUpperCase()+key.slice(1)+' image');
}

    symbol:get('symbol').toUpperCase(),
    assetClass:get('assetClass'),
    direction:get('direction'),

    exitReason:get('exitReason'),
    wentWell:get('wentWell'),

    emotionBefore:get('emotionBefore'),
    emotionAfter:get('emotionAfter'),
    checklist:{
      marketStructure:f.get('marketStructure')==='on',
      premiumDiscount:f.get('premiumDiscount')==='on',
      liquidity:f.get('liquidity')==='on',
      supplyDemand:f.get('supplyDemand')==='on',

function calendarCell(day,month){
  const key=isoDate(day);
  const ts=data.trades.filter(t=>t.tradeDate===key&&t.status==='closed');

function drawdownSvg(curve){
  if(!curve.length)return'<div class="empty">No drawdown data.</div>';
  const w=900,h=300,p=32,max=Math.max(1,...curve.map(x=>x.drawdown));
  const pts=curve.map((x,i)=>`${p+(i/Math.max(1,curve.length-1))*(w-2*p)},${p+(x.drawdown/max)*(h-2*p)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${[.25,.5,.75].map(r=>`<line class="chart-grid" x1="${p}" y1="${p+(h-2*p)*r}" x2="${w-p}" y2="${p+(h-2*p)*r}"/>`).join('')}<polyline points="${pts}" fill="none" stroke="var(--short)" stroke-width="2.5"/><text class="chart-label" x="${p}" y="16">Max Drawdown: ${money(max,data.profile.baseCurrency)}</text></svg>`;
}
function groupByMonth(trades){
  const map={};
  trades.filter(t=>t.status==='closed').forEach(t=>{
    const k=(t.tradeDate||'').slice(0,7)||'Unknown';
    map[k]=(map[k]||0)+num(t.realizedPnl);
  });
  return Object.entries(map).sort().map(([k,v])=>({month:k==='Unknown'?k:new Date(k+'-01T12:00').toLocaleDateString(undefined,{month:'short',year:'numeric'}),net:v}));
}

async function generateReview(id){
  const t=data.trades.find(x=>x.id===id);if(!t)return;
  const missing=[];const c=t.checklist||{};
  if(!c.marketStructure)missing.push('Market Structure');
  if(!c.premiumDiscount)missing.push('Premium/Discount');
  if(!c.liquidity)missing.push('Liquidity');
  if(!c.supplyDemand)missing.push('Supply/Demand');
  if(!c.liquidityBeforeBos)missing.push('Liquidity before BOS');
  const compliant=missing.length===0;
  const account=accountById(t.accountId);
  const riskOver=num(t.riskPct)>num(account?.riskLimitPct,Infinity);
  const evidence=String(t.checklistNotes?.evidence||'').trim();

  const output={
    verdict:compliant?'valid_setup':'no_setup_wait',
    checklistSummary:{
      marketStructure:{confirmed:!!c.marketStructure,evidence:evidence||'None'},
      premiumDiscount:{confirmed:!!c.premiumDiscount,evidence:evidence||'None'},
      liquidity:{confirmed:!!c.liquidity,evidence:evidence||'None'},
      supplyDemand:{confirmed:!!c.supplyDemand,evidence:evidence||'None'},
      liquidityBeforeBos:{confirmed:!!c.liquidityBeforeBos,evidence:evidence||'None'}
    },
    ruleViolations:missing,
    riskAssessment:riskOver?`Risk ${num(t.riskPct).toFixed(2)}% exceeded account limit of ${num(account?.riskLimitPct).toFixed(2)}%.`:`Risk parameters maintained within institutional limits.`,
    executionAssessment:compliant?(num(t.realizedR)>=0?'Execution followed saved checklist rules with positive expectancy outcome.':'Checklist complete, but trade resulted in loss. Review execution timing.'):'Execution noncompliant due to missing checklist confluences.',
    whatWasDoneWell:t.wentWell||(compliant?'All 5 institutional confluences validated.':'Trade logged for professional audit.'),
    mainMistake:t.wentWrong||(missing.length?`Missing confluences: ${missing.join(', ')}.`:'None documented.'),
    oneClearLesson:t.lesson||(compliant?'Maintain disciplined adherence to checklist guardrails.':'Wait for complete setup confirmation.'),
    auditMetadata:{engine:'Formidable Trading Professional Rule Engine',version:APP_VERSION,generatedAt:new Date().toISOString()}
  };

  data.reviews.push({id:uid('review'),tradeId:id,output,createdAt:new Date().toISOString()});
  ui.reviewTradeId=id;
  await pushToCloud();
  toast('Institutional review generated.');
  render();
}
function renderReview(o){

function wireCalculators(){
  const update=()=>{
    const bal=num($('#calc-balance')?.value),rp=num($('#calc-riskpct')?.value),entry=num($('#calc-entry')?.value),stop=num($('#calc-stop')?.value),pv=num($('#calc-point')?.value,1);
    const risk=bal*rp/100,dist=Math.abs(entry-stop),size=dist&&pv?risk/(dist*pv):0;
    $('#position-output').innerHTML=`Risk Amount: <b>${money(risk,data.profile.baseCurrency)}</b><br>Calculated Units/Lots: <b>${round(size,4)}</b>`;
    const re=num($('#rr-entry')?.value),rs=num($('#rr-stop')?.value),rt=num($('#rr-target')?.value),r=Math.abs(re-rs),reward=Math.abs(rt-re),rr=r?reward/r:0;
    $('#rr-output').innerHTML=`Risk Distance: <b>${round(r,5)}</b><br>Reward Distance: <b>${round(reward,5)}</b><br>Planned R:R: <b>1:${round(rr,2)}</b>`;
    const limit=num($('#dl-limit')?.value),per=num($('#dl-risk')?.value),used=num($('#dl-used')?.value),remaining=Math.max(0,limit-used),trades=per?Math.floor(remaining/per):0;
    $('#dl-output').innerHTML=`Remaining Capacity: <b>${money(remaining,data.profile.baseCurrency)}</b><br>Full-Risk Trades Left: <b>${trades}</b>${remaining<=0?'<br><b class="negative">Daily limit reached. Stop trading.</b>':''}`;
  };
  $$('.pc,.rr,.dl').forEach(x=>x.addEventListener('input',update));update();
}

async function saveAccount(e,id){
  e.preventDefault();const f=new FormData(e.target),get=k=>String(f.get(k)||'').trim();
  const old=data.accounts.find(x=>x.id===id);
  const active=f.get('active')==='on';
  const a={...(old||{}),id:old?.id||uid('acc'),name:get('name'),broker:get('broker'),type:get('type'),currency:get('currency'),startingBalance:num(get('startingBalance')),riskLimitPct:num(get('riskLimitPct'),1),dailyLossLimit:num(get('dailyLossLimit')),maxDrawdownLimit:num(get('maxDrawdownLimit')),active,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
  if(active)data.accounts.forEach(x=>x.active=false);
  if(old)data.accounts=data.accounts.map(x=>x.id===id?a:x);else data.accounts.push(a);
  if(!data.accounts.some(x=>x.active))data.accounts[0].active=true;
  await pushToCloud();closeModal();toast('Account saved & synced.');render();
}
async function setActiveAccount(id){
  data.accounts.forEach(a=>a.active=a.id===id);
  await pushToCloud();toast('Active account updated.');render();
}
async function deleteAccount(id){
  if(data.accounts.length<=1)return toast('At least one account is required.','error');
  data.accounts=data.accounts.filter(x=>x.id!==id);
  if(!data.accounts.some(x=>x.active))data.accounts[0].active=true;
  await pushToCloud();toast('Account deleted.','warn');render();
}

function exportBackup(){
  download(`Formidable_Trading_backup_${todayInZone()}.json`,JSON.stringify({app:'Formidable Trading',version:APP_VERSION,exportedAt:new Date().toISOString(),user:cloudUser?.email,data},null,2));
  toast('Full workspace backup exported.');

function wireImport(){
  const input=$('#backup-file');
  if(input)input.addEventListener('change',async()=>{
    const file=input.files[0];if(!file)return;
    try{
      const parsed=JSON.parse(await file.text());
      const incoming=parsed.data||parsed;
      if(!incoming||!Array.isArray(incoming.trades))throw new Error('Invalid backup file structure');
      if(!confirm(`Import backup containing ${incoming.trades.length} trades? This replaces current workspace data.`))return;
      data=incoming;
      await pushToCloud();
      applyTheme();
      toast('Workspace restored successfully.');
      render();
    }catch(err){toast(err.message||'Import failed.','error')}
  });
}
async function resetWorkspace(){
  if(!confirm('Reset entire journal workspace? All trades and settings will be cleared.'))return;
  data=defaultData();
  await pushToCloud();
  toast('Workspace reset.','warn');
  render();
}
